<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ACMS App</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Core CSS -->
    <link rel="stylesheet" href="core.css?v=82">
    <!-- Theme CSS will be injected dynamically by app.js -->
</head>
<body>
    <!-- F1.2 App Loader -->
    <div id="app-loader">
        <img id="loader-logo" src="" alt="App Logo" style="display:none;">
        <div class="loader-bar"></div>
    </div>

    <!-- Vue App Mount Point -->
    <div id="app" style="opacity: 0; transition: opacity 0.3s ease;">
        <router-view></router-view>
    </div>

    <!-- Local Vue 3 & Vue Router (Fast 0ms Local Asset Load) -->
    <script src="vendor/vue.global.prod.js"></script>
    <script src="vendor/vue-router.global.prod.js"></script>
    
    <!-- Multi-Language Dictionaries (EN Base + TR, DE, ES, PT, FR, IT, RU) -->
    <script src="locales/en.js?v=85"></script>
    <script src="locales/tr.js?v=85"></script>
    <script src="locales/de.js?v=85"></script>
    <script src="locales/es.js?v=85"></script>
    <script src="locales/pt.js?v=85"></script>
    <script src="locales/fr.js?v=85"></script>
    <script src="locales/it.js?v=85"></script>
    <script src="locales/ru.js?v=85"></script>
    <script src="i18n.js?v=85"></script>
    
    <!-- 2026 Dark Elite Theme Modular Components -->
    <link id="elite-theme-style" rel="stylesheet" href="themes/elite-dark-2026/theme.css?v=85">
    <script src="themes/elite-dark-2026/components/OnboardingModal.js?v=85"></script>
    <script src="themes/elite-dark-2026/components/TopHeader.js?v=85"></script>
    <script src="themes/elite-dark-2026/components/LeftDrawer.js?v=85"></script>
    <script src="themes/elite-dark-2026/components/HistoricalArchive.js?v=85"></script>
    <script src="themes/elite-dark-2026/components/InboxModal.js?v=85"></script>
    <script src="themes/elite-dark-2026/components/SettingsModal.js?v=85"></script>
    <script src="themes/elite-dark-2026/components/DailyTickets.js?v=85"></script>
    <script src="themes/elite-dark-2026/components/MatchFilters.js?v=85"></script>
    <script src="themes/elite-dark-2026/components/MatchList.js?v=85"></script>
    <script src="themes/elite-dark-2026/components/MatchDetailModal.js?v=85"></script>
    <script src="themes/elite-dark-2026/components/BottomNav.js?v=85"></script>
    <script src="themes/elite-dark-2026/components/ExpertsView.js?v=85"></script>
    <script src="themes/elite-dark-2026/components/StrategyView.js?v=85"></script>
    <script src="themes/elite-dark-2026/components/AiChatView.js?v=85"></script>
    <script src="themes/elite-dark-2026/elite_dark_2026.js?v=85"></script>

    <!-- App Logic -->
    <script src="app.js?v=85"></script>
</body>
</html>
